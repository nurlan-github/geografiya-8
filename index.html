<!doctype html>
<html lang="kaa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Qaraqalpaqstan geografiyası</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;800;900&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<style>
/* Layout: one-screen app shell. Home = mission map; mission = topbar / step screen / Dáwlet host strip / action button */
:root{
  --bg:#E9F1F0;--surface:#FFFFFF;--ink:#132E36;--muted:#5C7177;--line:#D3DFDD;
  --pri:#127A8B;--pri-d:#0C5967;--pri-soft:#D6EEF1;--on-pri:#FFFFFF;
  --gold:#E8A33A;--gold-d:#B97A1C;--gold-soft:#FBEBCF;
  --ok:#2F9B5A;--ok-d:#22733F;--ok-soft:#DDF3E5;
  --no:#D0473F;--no-d:#9E2F29;--no-soft:#FBE1DE;
  --sky:#D5E7EC;
  --f:"Noto Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1A1E;--surface:#15262B;--ink:#E5EEEC;--muted:#93A9AD;--line:#27393F;
  --pri:#3FB5C8;--pri-d:#1F7F8F;--pri-soft:#143A42;--on-pri:#062027;
  --gold:#F0B551;--gold-d:#A87522;--gold-soft:#3A2E17;
  --ok:#5CCB89;--ok-d:#2E8A55;--ok-soft:#173628;--no:#F07D75;--no-d:#A33B34;--no-soft:#3D1E1C;--sky:#1A2F35;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1A1E;--surface:#15262B;--ink:#E5EEEC;--muted:#93A9AD;--line:#27393F;
  --pri:#3FB5C8;--pri-d:#1F7F8F;--pri-soft:#143A42;--on-pri:#062027;
  --gold:#F0B551;--gold-d:#A87522;--gold-soft:#3A2E17;
  --ok:#5CCB89;--ok-d:#2E8A55;--ok-soft:#173628;--no:#F07D75;--no-d:#A33B34;--no-soft:#3D1E1C;--sky:#1A2F35;color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.5;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
#app{height:100%;max-width:820px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);position:relative}
@media (min-width:860px){#app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* chunky app buttons */
.btn{border:0;border-radius:14px;padding:14px 18px;font-weight:800;font-size:1rem;letter-spacing:.02em;background:var(--pri);color:var(--on-pri);box-shadow:0 4px 0 var(--pri-d);transition:transform .08s,box-shadow .08s;text-transform:uppercase}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--pri-d)}
.btn:disabled{background:var(--line);color:var(--muted);box-shadow:0 4px 0 var(--line);cursor:default;transform:none}
.btn.gold{background:var(--gold);box-shadow:0 4px 0 var(--gold-d);color:#2B1C05}
.btn.ok{background:var(--ok);box-shadow:0 4px 0 var(--ok-d);color:var(--on-pri)}
.btn.no{background:var(--no);box-shadow:0 4px 0 var(--no-d);color:#fff}
.btn.ghost{background:var(--surface);color:var(--pri);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.sm{padding:9px 14px;font-size:.85rem;border-radius:12px}
.block{width:100%}

/* topbar */
.top{display:flex;align-items:center;gap:12px;padding-block:12px;flex:none}
.iconbtn{width:40px;height:40px;border-radius:12px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn svg{width:18px;height:18px}
.pbar{flex:1;height:16px;border-radius:99px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .4s;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.stars{display:flex;align-items:center;gap:4px;font-weight:900;color:var(--gold);flex:none}
.stars svg{width:24px;height:24px}

/* screen area */
.screen{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:14px;padding-block:6px 14px}
.screen.full{overflow:hidden;padding-block:0 8px}
.h{font-weight:900;font-size:1.45rem;line-height:1.2;text-wrap:balance;margin:0}
.sub{color:var(--muted);margin:0;font-size:.95rem}
.card{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:12px;min-width:0}
.card p{margin:0}
.kicker{font-size:.72rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--pri)}
img.ph{width:100%;border-radius:12px;display:block;max-height:42vh;object-fit:cover}
.cap{font-size:.8rem;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.grid2>*{min-width:0}

/* host strip */
.host{flex:none;display:flex;align-items:flex-end;gap:10px;padding-block:6px 4px}
.host .av{width:62px;height:80px;flex:none}
.host .bub{flex:1;min-width:0;background:var(--surface);border:2px solid var(--line);border-radius:16px 16px 16px 4px;padding:10px 12px;font-size:.93rem;line-height:1.4;min-height:48px;margin-bottom:10px}
.host .bub b{color:var(--gold-d)}
.foot{flex:none;padding-block:8px calc(12px + env(safe-area-inset-bottom,0px));border-top:2px solid var(--line);background:var(--bg)}
.foot.ok{background:var(--ok-soft);border-color:transparent}
.foot.no{background:var(--no-soft);border-color:transparent}
.fbtxt{font-weight:800;margin:0 0 8px;font-size:.95rem}
.foot.ok .fbtxt{color:var(--ok)}.foot.no .fbtxt{color:var(--no)}
.fbtxt span{display:block;font-weight:400;color:var(--ink);font-size:.9rem;margin-top:2px}

/* home */
.homehead{display:flex;align-items:center;justify-content:space-between;padding-block:14px 6px;flex:none}
.brand{font-weight:900;font-size:1.05rem}
.brand small{display:block;font-weight:600;font-size:.75rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.hero{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:end}
.hero .av{width:120px;height:154px}
.hero .bub{background:var(--surface);border:2px solid var(--line);border-radius:18px 18px 18px 4px;padding:12px 14px;margin-bottom:18px;font-size:.95rem}
.topic{background:var(--pri);color:var(--on-pri);border-radius:20px;padding:16px 18px;display:grid;gap:4px;box-shadow:0 5px 0 var(--pri-d)}
.topic .t1{font-size:.75rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.topic .t2{font-size:1.6rem;font-weight:900;line-height:1.1}
.topic .t3{font-size:.85rem;opacity:.9}
.path{display:grid;gap:4px;padding-block:8px 20px}
.node{display:flex;align-items:center;gap:14px;background:none;border:0;padding:6px 0;text-align:left;width:100%}
.node:nth-child(4n+2){padding-left:18%}.node:nth-child(4n+3){padding-left:32%}.node:nth-child(4n+4){padding-left:18%}
.nc{position:relative;width:70px;height:66px;border-radius:50%;background:var(--surface);border:3px solid var(--line);box-shadow:0 5px 0 var(--line);display:grid;place-items:center;flex:none;color:var(--muted);font-weight:900;font-size:1.2rem}
.nc svg{width:30px;height:30px}
.node.done .nc{background:var(--gold);border-color:var(--gold-d);box-shadow:0 5px 0 var(--gold-d);color:#2B1C05}
.node.next .nc{background:var(--pri);border-color:var(--pri-d);box-shadow:0 5px 0 var(--pri-d);color:var(--on-pri);animation:pulse 1.8s ease-in-out infinite}
.nl b{display:block;font-weight:800;font-size:1rem}
.nl span{font-size:.8rem;color:var(--muted)}
.badge{position:absolute;right:-6px;top:-6px;background:var(--ok);color:#fff;border-radius:99px;width:24px;height:24px;display:grid;place-items:center;border:2px solid var(--surface)}
.badge svg{width:14px;height:14px}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:.85rem;padding:6px 0;justify-self:center}

/* flashcards */
.flip{perspective:1000px;min-height:240px;cursor:pointer;border:0;background:none;padding:0;width:100%}
.flip .in{position:relative;width:100%;height:100%;min-height:240px;transition:transform .5s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .fc,.flip .bc{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;display:grid;place-items:center;padding:22px;text-align:center}
.flip .fc{background:var(--pri);color:var(--on-pri);box-shadow:0 6px 0 var(--pri-d)}
.flip .fc b{font-size:2rem;font-weight:900;line-height:1.15}
.flip .fc small{position:absolute;bottom:14px;left:0;right:0;font-size:.8rem;opacity:.85}
.flip .bc{background:var(--surface);border:3px solid var(--pri);transform:rotateY(180deg);font-size:1.05rem}
.dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.seen{background:var(--pri)}.dots i.cur{background:var(--gold);transform:scale(1.3)}
.row{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}

/* 3D */
.scene{position:relative;flex:1;min-height:260px;border-radius:18px;overflow:hidden;background:var(--sky);border:2px solid var(--line)}
.scene canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.labels{position:absolute;inset:0;pointer-events:none}
.lbl{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;white-space:nowrap;font-size:.72rem;font-weight:800;background:rgba(255,255,255,.92);color:#132E36;border:1px solid rgba(19,46,54,.2);border-radius:99px;padding:3px 9px;cursor:pointer;margin-top:-8px}
.lbl::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:8px;background:rgba(19,46,54,.55)}
.lbl.on{background:#E8A33A;color:#2B1C05;border-color:#B97A1C}
.lbl.static{cursor:default}
.ov{position:absolute;background:rgba(255,255,255,.9);color:#132E36;border-radius:12px;padding:6px 10px}
.ov.tl{left:10px;top:10px}.ov.bl{left:10px;right:10px;bottom:10px;display:grid;gap:6px}
.yrbig{font-size:2rem;font-weight:900;color:#127A8B;line-height:1}
.inset{position:absolute;right:10px;top:10px;width:clamp(64px,20%,120px);aspect-ratio:410/574;border-radius:8px;overflow:hidden;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.25);background:#fff;margin:0}
.inset img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s}
.inset img.on{opacity:1}
.ov input[type=range]{width:100%;accent-color:#127A8B}
.ticks{display:flex;justify-content:space-between;font-size:.7rem;color:#5C7177;font-weight:700}
.hint3d{position:absolute;left:50%;top:10px;transform:translateX(-50%);font-size:.72rem;background:rgba(19,46,54,.75);color:#fff;border-radius:99px;padding:4px 10px;white-space:nowrap;pointer-events:none}
.scene.no3d{background:var(--surface)}
.scene.no3d canvas,.scene.no3d .labels,.scene.no3d .hint3d{display:none}
.scene.no3d .inset{position:relative;inset:auto;width:min(240px,60%);margin:64px auto 140px;display:block}
.fallback{padding:14px;font-size:.92rem}

/* charts and data */
.bars{display:grid;gap:10px}
.bar .l{display:flex;justify-content:space-between;font-size:.88rem;font-weight:600;gap:8px}
.bar .tr{height:18px;background:var(--line);border-radius:6px;overflow:hidden}
.bar .tr i{display:block;height:100%;width:0;border-radius:6px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--c)}
svg text{fill:var(--ink);font-family:var(--f)}
svg .mut{fill:var(--muted)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
td.r,th.r{text-align:right}
.big{font-size:2.6rem;font-weight:900;line-height:1;color:var(--pri)}
.names{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.names div{border:2px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center;background:var(--surface)}
.names b{display:block;font-weight:900;font-size:1.1rem}
.names span{font-size:.75rem;color:var(--muted)}
.fact{background:var(--gold-soft);border-radius:14px;padding:12px 14px;font-size:.95rem}
.fact b{color:var(--gold-d)}

/* choices */
.opts{display:grid;gap:10px}
.opt{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;font-weight:600;box-shadow:0 3px 0 var(--line)}
.opt.sel{border-color:var(--pri);background:var(--pri-soft);box-shadow:0 3px 0 var(--pri)}
.opt.right{border-color:var(--ok);background:var(--ok-soft);box-shadow:0 3px 0 var(--ok);color:var(--ok)}
.opt.wrong{border-color:var(--no);background:var(--no-soft);box-shadow:0 3px 0 var(--no);color:var(--no)}
.opt:disabled{cursor:default}
.calc{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.calc input{width:120px;padding:12px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit;font-weight:800;font-size:1.2rem;text-align:center}

/* lake game */
.lakecard{background:var(--surface);border:3px solid var(--pri);border-radius:22px;padding:28px 12px;text-align:center;font-weight:900;font-size:2rem;box-shadow:0 6px 0 var(--pri-d)}
.lakecard.pop{animation:pop .3s}
@keyframes pop{0%{transform:scale(.85)}100%{transform:scale(1)}}
.sortb{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sortb .btn{text-transform:none;font-size:.9rem;line-height:1.25;padding:14px 10px}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bin{border:2px dashed var(--line);border-radius:14px;padding:10px;min-height:64px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
.bin h4{width:100%;margin:0;font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.bin span{font-size:.78rem;background:var(--pri-soft);padding:2px 8px;border-radius:99px}
.bin span.x{background:var(--no-soft);color:var(--no)}

/* reward overlay */
.reward{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;z-index:30;padding-block:20px}
.reward .av{width:150px;height:192px}
.reward .rs{display:flex;gap:8px}
.reward .rs svg{width:52px;height:52px;animation:starin .5s backwards}
.reward .rs svg:nth-child(2){animation-delay:.2s}.reward .rs svg:nth-child(3){animation-delay:.4s}
@keyframes starin{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.reward .bub{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:10px 14px;margin:0}
.sheet{position:absolute;inset:0;background:rgba(0,0,0,.4);z-index:40;display:flex;align-items:flex-end}
.sheet .pane{background:var(--surface);width:100%;border-radius:22px 22px 0 0;max-height:85%;overflow:auto;display:grid;gap:10px;padding-block:18px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet ul{margin:0;padding-left:1.2em;display:grid;gap:6px;font-size:.92rem}

@media (max-height:640px){.host .av{width:48px;height:62px}.host .bub{font-size:.85rem}}
/* multi-topic additions */
.chhead{display:grid;gap:2px;margin-top:10px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.tcard{display:flex;gap:12px;align-items:center;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px;box-shadow:0 4px 0 var(--line);min-width:0}
.tcard:active{transform:translateY(2px);box-shadow:0 2px 0 var(--line)}
.tcard.done{border-color:var(--gold);box-shadow:0 4px 0 var(--gold-d)}
.ring{--p:0;flex:none;width:54px;height:54px;border-radius:50%;background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center}
.ring>span{width:42px;height:42px;border-radius:50%;background:var(--surface);display:grid;place-items:center;color:var(--pri);font-weight:900}
.ring svg{width:22px;height:22px}
.tl{display:grid;gap:2px;min-width:0}
.tl b{font-weight:800;line-height:1.25}
.tn{font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ts{display:flex;align-items:center;gap:4px;font-size:.8rem;font-weight:800;color:var(--gold-d)}
.ts svg{width:15px;height:15px;color:var(--gold)}
.tbtn{border:0;text-align:left;width:100%;cursor:pointer}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.facts>div{background:var(--pri-soft);border-radius:12px;padding:10px 12px;display:grid;gap:2px}
.facts b{font-weight:900;font-size:1.05rem;color:var(--pri)}
.facts span{font-size:.85rem}
.ul{margin:0;padding-left:1.2em;display:grid;gap:4px}
.tasks{margin:0;padding-left:1.2em;display:grid;gap:8px}
.fig{margin:0;display:grid;gap:6px}
.okf{background:var(--ok-soft)}.okf b{color:var(--ok)}
.svgbox{overflow-x:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid var(--pri);background:transparent;color:var(--pri);border-radius:99px;padding:5px 12px;font-size:.85rem;font-weight:700}
.chip[aria-pressed="true"]{background:var(--pri);color:var(--on-pri)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcol{display:grid;gap:8px;align-content:start}
.mi{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;font-weight:600;font-size:.88rem;text-align:left;box-shadow:0 3px 0 var(--line);min-height:48px}
.mi.sel{border-color:var(--pri);background:var(--pri-soft);box-shadow:0 3px 0 var(--pri)}
.mi.done{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);box-shadow:none;opacity:.75;cursor:default}
.mi.bad{border-color:var(--no);background:var(--no-soft);animation:shake .4s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.olist{margin:0;padding-left:1.4em;display:grid;gap:6px;min-height:20px}
.olist li{background:var(--ok-soft);border-radius:10px;padding:8px 10px;font-weight:600;font-size:.9rem}
.pool{display:grid;gap:8px}
.mapwrap{position:relative;width:100%;max-width:640px;margin:0 auto;border-radius:14px;overflow:hidden;border:2px solid var(--line);cursor:crosshair;background:#fff}
.mapwrap img{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}
.mapwrap canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;image-rendering:pixelated}
.mk{position:absolute;inset:0;pointer-events:none}
.dot{position:absolute;width:18px;height:18px;border-radius:50%;transform:translate(-50%,-50%);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.dot.ok{background:#2F9B5A}.dot.no{background:#D0473F}
.dotl{position:absolute;transform:translate(-50%,-150%);background:#2F9B5A;color:#fff;font-weight:800;font-size:.75rem;padding:2px 8px;border-radius:99px;white-space:nowrap}
.gal{justify-items:stretch}
.gal .gn{font-size:1.15rem;font-weight:900}
.gal .gt{margin:2px 0 0}
textarea{width:100%;border:2px solid var(--line);border-radius:12px;padding:12px;font:inherit;background:var(--bg);color:var(--ink);resize:vertical}
.lbl.big{font-size:.82rem;background:rgba(19,46,54,.85);color:#fff;border-color:transparent}
.lbl.big::after{background:rgba(19,46,54,.85)}
.ov.tr{right:10px;top:10px;left:auto;font-size:.7rem;font-weight:700;padding:4px 8px}
.screen.full .hint3d{top:auto;bottom:10px}
.screen.full .scene .cap3d{top:10px}

.frow{display:flex;gap:10px;align-items:center}
.frow .btn{flex:1;min-width:0}
.skip{flex:none;background:none;border:0;color:var(--muted);font-weight:700;font-size:.85rem;padding:10px 4px;text-decoration:underline;text-underline-offset:3px}
.skip:hover{color:var(--ink)}
.screen>*{flex-shrink:0}
.screen.full>.scene{flex-shrink:1}
/* ===== Dáwlet v2 ===== */
.dw{overflow:visible;width:100%;height:100%;display:block}
.dw *{transform-box:view-box}
.dw .dw-all{transform-origin:80px 212px;animation:dwBob 3.6s ease-in-out infinite}
.dw .dw-body{transform-origin:80px 196px;animation:dwBreath 3.6s ease-in-out infinite}
.dw .dw-head{transform-origin:80px 118px;animation:dwSway 5.2s ease-in-out infinite;transition:transform .35s}
.dw .dw-arm-l{transform-origin:57px 124px;animation:dwArmL 3.6s ease-in-out infinite;transition:transform .35s}
.dw .dw-arm-r{transform-origin:103px 124px;animation:dwArmR 3.6s ease-in-out infinite;transition:transform .35s}
.dw .dw-eyes{transform-box:fill-box;transform-origin:center;transition:transform .07s}
.dw.blink .dw-eyes{transform:scaleY(.08)}
.dw .dw-pupils{transition:transform .12s}
.dw .dw-joy,.dw .dw-drop,.dw .dw-fx{opacity:0}
.dw .dw-brow-l,.dw .dw-brow-r{transform-box:fill-box;transform-origin:center;transition:transform .3s}
.dw .m{display:none}
.dw:not([data-mouth]) .m-smile,.dw[data-mouth="smile"] .m-smile,.dw[data-mouth="mid"] .m-mid,.dw[data-mouth="open"] .m-open,.dw[data-mouth="grin"] .m-grin,.dw[data-mouth="frown"] .m-frown{display:inline}
/* talk */
.dw.talk .dw-head{animation:dwNod .5s ease-in-out infinite}
.dw.talk .dw-arm-r{animation:dwGesture 1.6s ease-in-out infinite}
/* wave */
.dw.wave .dw-arm-r{animation:dwWave .45s ease-in-out 4 alternate;transform:rotate(-118deg)}
/* happy */
.dw.happy .dw-all{animation:dwJump .55s cubic-bezier(.3,.7,.4,1) 2}
.dw.happy .dw-arm-l{animation:none;transform:rotate(112deg)}
.dw.happy .dw-arm-r{animation:none;transform:rotate(-112deg)}
.dw.happy .dw-eyes{opacity:0}
.dw.happy .dw-joy{opacity:1}
.dw.happy .dw-fx{animation:dwFx .9s ease-out 1 forwards}
.dw.happy .dw-brow-l{transform:translateY(-3px)}.dw.happy .dw-brow-r{transform:translateY(-3px)}
/* sad */
.dw.sad .dw-head{animation:none;transform:translateY(3px) rotate(5deg)}
.dw.sad .dw-arm-l{animation:none;transform:rotate(-6deg)}
.dw.sad .dw-arm-r{animation:none;transform:rotate(6deg)}
.dw.sad .dw-brow-l{transform:rotate(-14deg) translateY(1px)}.dw.sad .dw-brow-r{transform:rotate(14deg) translateY(1px)}
.dw.sad .dw-drop{animation:dwDrop 1.2s ease-in 1 forwards}
.dw.sad .dw-all{animation:dwShake .5s ease-in-out 1}
@keyframes dwBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
@keyframes dwBreath{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,1.022)}}
@keyframes dwSway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2.5deg)}}
@keyframes dwNod{0%,100%{transform:rotate(-1.5deg) translateY(0)}50%{transform:rotate(1.5deg) translateY(1.2px)}}
@keyframes dwArmL{0%,100%{transform:rotate(0)}50%{transform:rotate(3deg)}}
@keyframes dwArmR{0%,100%{transform:rotate(0)}50%{transform:rotate(-3deg)}}
@keyframes dwGesture{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(-38deg)}}
@keyframes dwWave{from{transform:rotate(-100deg)}to{transform:rotate(-132deg)}}
@keyframes dwJump{0%{transform:translateY(0) scale(1.06,.92)}35%{transform:translateY(-22px) scale(.95,1.06)}70%{transform:translateY(0) scale(1.05,.94)}100%{transform:translateY(0) scale(1,1)}}
@keyframes dwShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
@keyframes dwFx{0%{opacity:0;transform:scale(.4)}25%{opacity:1}100%{opacity:0;transform:scale(1.25) translateY(-8px)}}
@keyframes dwDrop{0%{opacity:0;transform:translateY(-4px)}30%{opacity:1}100%{opacity:0;transform:translateY(14px)}}
.dw .dw-fx{transform-origin:80px 60px}
@media (prefers-reduced-motion:reduce){.dw *{animation:none!important;transition:none!important}}
.hero .av{width:124px;height:172px}
.host .av{width:66px;height:92px}
.reward .av{width:150px;height:208px}

.trow:hover,.mrow:hover{border-color:var(--pri)}
.tnum{flex:none;width:34px;height:34px;border-radius:9px;background:var(--pri-soft);color:var(--pri);font-weight:800;display:grid;place-items:center}
.trow.done .tnum{background:var(--ok-soft);color:var(--ok)}
.tl{flex:1;min-width:0;display:grid;gap:3px}
.tl b{font-weight:700;line-height:1.3}
.tmeta{font-size:.78rem;color:var(--muted)}
.tbar{height:4px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:2px}.tbar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.pchip{flex:none;font-size:.75rem;font-weight:800;padding:4px 9px;border-radius:99px;background:var(--line);color:var(--muted);white-space:nowrap}
.pchip.g5{background:var(--ok-soft);color:var(--ok)}.pchip.g4{background:var(--pri-soft);color:var(--pri)}.pchip.g3{background:var(--gold-soft);color:var(--gold-d)}.pchip.g2{background:var(--no-soft);color:var(--no)}
.pchip.next{background:var(--pri);color:var(--on-pri)}
.mi-ic{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--bg);color:var(--muted);border:1px solid var(--line);font-weight:800;font-size:.85rem}
.mi-ic svg{width:18px;height:18px}
.mrow.done .mi-ic{background:var(--ok);border-color:var(--ok);color:#fff}
.mrow.next{border-color:var(--pri);border-width:1.5px}
.mrow.next .mi-ic{background:var(--pri);border-color:var(--pri);color:var(--on-pri)}
.reward .rs{display:none}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex:none;overflow-x:auto}
.tabs button{background:none;border:0;padding:10px 12px;font-weight:700;color:var(--muted);border-bottom:2.5px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--pri);border-color:var(--pri)}
.tbl.wide{overflow-x:auto;max-width:100%}
.gtab{font-size:.8rem}.gtab th,.gtab td{padding:6px 7px;border-bottom:1px solid var(--line);white-space:nowrap}
.gtab td.nm{white-space:nowrap;font-weight:600}
.gtab td.g5{background:var(--ok-soft)}.gtab td.g4{background:var(--pri-soft)}.gtab td.g3{background:var(--gold-soft)}.gtab td.g2{background:var(--no-soft)}
.gtab .avgrow td{font-weight:800;border-top:2px solid var(--line)}
.plan summary{cursor:pointer;line-height:1.4}
.plan .pl{display:grid;gap:8px;margin-top:10px}.plan p{margin:0}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.steps li{display:flex;gap:10px;align-items:flex-start;font-size:.9rem}
.tm{flex:none;font-weight:800;font-size:.75rem;background:var(--pri-soft);color:var(--pri);border-radius:6px;padding:3px 7px;min-width:52px;text-align:center}
.frm{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.frm label{display:grid;gap:4px;font-size:.8rem;font-weight:700;color:var(--muted)}
.frm input{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px}
textarea.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.78rem;word-break:break-all}
@media (max-width:420px){.frm{grid-template-columns:1fr}.stats b{font-size:1.1rem}}
/* calmer Dáwlet */
.dw .dw-all{animation-duration:4.5s}
.dw.happy .dw-all{animation:dwNodYes .6s ease-in-out 1}
.dw.happy .dw-arm-l{transform:none;animation:dwArmL 3.6s ease-in-out infinite}

.dw.happy .dw-fx{display:none}

.dw.sad .dw-drop{display:none}
@keyframes dwNodYes{0%,100%{transform:translateY(0)}40%{transform:translateY(-4px)}}
.gtab td.part{font-style:italic;opacity:.75}

const HAS3D=(()=>{try{return !!window.THREE&&!!THREE.OrbitControls&&!!document.createElement('canvas').getContext('webgl')}catch(e){return false}})();
function hash(x,y){const s=Math.sin(x*127.1+y*311.7)*43758.5453;return s-Math.floor(s)}
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
 const a=hash(xi,yi),b=hash(xi+1,yi),c=hash(xi,yi+1),d=hash(xi+1,yi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function fbm(x,y){return vnoise(x,y)*.55+vnoise(x*2.1,y*2.1)*.3+vnoise(x*4.3,y*4.3)*.15}
const dec=b=>{const r=atob(b),u=new Uint8Array(r.length);for(let i=0;i<r.length;i++)u[i]=r.charCodeAt(i);return u};
function makeScene(box,canvas,camPos,target){
 const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));
 const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(38,1,.1,300);camera.position.copy(camPos);
 const controls=new THREE.OrbitControls(camera,canvas);controls.target.copy(target);controls.enableDamping=true;controls.maxPolarAngle=Math.PI*.47;controls.enablePan=false;controls.minDistance=3;controls.maxDistance=60;
 scene.add(new THREE.HemisphereLight(0xf2f6ff,0x6b5a40,.75));const sun=new THREE.DirectionalLight(0xfff3dd,.85);sun.position.set(-8,14,6);scene.add(sun);
 const resize=()=>{const w=box.clientWidth,h=box.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();};
 resize();const ro=new ResizeObserver(resize);ro.observe(box);
 let alive=true,hooks=[],fly=null;
 const S={scene,camera,controls,onFrame:f=>hooks.push(f),
  flyTo(p1,q1,d=1600){fly={t0:performance.now(),d:REDUCED?1:d,p0:camera.position.clone(),q0:controls.target.clone(),p1,q1}},
  dispose(){alive=false;ro.disconnect();controls.dispose();scene.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material)o.material.dispose();});renderer.dispose();try{renderer.forceContextLoss()}catch(e){}}};
 (function loop(){if(!alive)return;requestAnimationFrame(loop);
  if(fly){const t=Math.min(1,(performance.now()-fly.t0)/fly.d),e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;camera.position.lerpVectors(fly.p0,fly.p1,e);controls.target.lerpVectors(fly.q0,fly.q1,e);if(t>=1)fly=null;}
  hooks.forEach(f=>f());controls.update();renderer.render(scene,camera);})();
 return S;
}
function placeLabels(S,box,items){const w=box.clientWidth,h=box.clientHeight,v=new THREE.Vector3();

function ribbonMesh(S,pts,wFn,color){const pos=[],idx=[];for(let k=0;k<pts.length;k++){const p=pts[k],q=pts[Math.min(k+1,pts.length-1)],o=pts[Math.max(k-1,0)];
  const dx=q.x-o.x,dz=q.z-o.z,l=Math.hypot(dx,dz)||1,nx=-dz/l,nz=dx/l,w=wFn(k/(pts.length-1));
  pos.push(p.x+nx*w,p.y,p.z+nz*w,p.x-nx*w,p.y,p.z-nz*w);if(k<pts.length-1){const a=k*2;idx.push(a,a+1,a+2,a+1,a+3,a+2);}}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setIndex(idx);g.computeVertexNormals();
 const m=new THREE.Mesh(g,new THREE.MeshPhongMaterial({color,shininess:70,side:THREE.DoubleSide}));S.scene.add(m);return m;}

/* --- Karakalpakstan region model (schematic, built from the textbook okrug map) --- */
const REGC={0:'#CDB98A',1:'#ECE6D4',2:'#86A95E',3:'#DDBF86',4:'#C9C4B7',5:'#3E93B0'};
const REGFOCUS={ustirt:0,aral:1,delta:2,qizil:3};
function regionScene(box,opt={}){
 const R=DATA.region,GW=R.w,GH=R.h,F=R.f,M=dec(R.m),RG=dec(R.r),WT=dec(R.wt);
 const SX=18,SZ=SX*GH/GW,VS=1/230,cell=SX/(GW-1);
 const toW=(px,py)=>[(px/F)/(GW-1)*SX-SX/2,(py/F)/(GH-1)*SZ-SZ/2];
 const hAt=(px,py)=>{const c=Math.min(GW-1,Math.round(px/F)),r=Math.min(GH-1,Math.round(py/F));return (M[r*GW+c]*2-40)*VS};
 const asp=(box.clientWidth||1)/(box.clientHeight||1),kz=Math.max(1,1.3/asp);
 const S=makeScene(box,box.querySelector('canvas'),new THREE.Vector3(0,13*kz,12*kz),new THREE.Vector3(0,0,0.5));
 const geo=new THREE.PlaneGeometry(SX,SZ,GW-1,GH-1);geo.rotateX(-Math.PI/2);
 const Pp=geo.attributes.position,N=Pp.count,col=new Float32Array(N*3),BASE=-.55;
 const edge=i=>{const r=Math.floor(i/GW),c=i%GW;return r===0||c===0||r===GH-1||c===GW-1};
 for(let i=0;i<N;i++)Pp.setY(i,edge(i)?BASE:(M[i]*2-40)*VS);
 geo.computeVertexNormals();
 const nrm=geo.attributes.normal,tmp=new THREE.Color(),grey=new THREE.Color('#BDBAB2'),cliff=new THREE.Color('#9A7650'),skirt=new THREE.Color('#6E5139');
 const focus=opt.focus!=null?REGFOCUS[opt.focus]:null;
 for(let i=0;i<N;i++){const r=Math.floor(i/GW),c=i%GW,g=RG[i];
  if(edge(i))tmp.copy(skirt);
  else if(WT[i])tmp.set(REGC[5]);
  else{tmp.set(REGC[g]);const st=1-nrm.getY(i);if(st>.18&&g!==5)tmp.lerp(cliff,Math.min(1,(st-.18)*2.4));
   if(g===2){const n=fbm(c*.3,r*.3);tmp.lerp(new THREE.Color('#5F8A44'),n*.5)}}
  if(focus!=null&&g!==focus&&!(focus===2&&g===5)&&!edge(i))tmp.lerp(grey,.62);
  const n=fbm(c*.2,r*.2)*.1-.05;col[i*3]=tmp.r+n;col[i*3+1]=tmp.g+n;col[i*3+2]=tmp.b+n;}
 geo.setAttribute('color',new THREE.BufferAttribute(col,3));
 S.scene.add(new THREE.Mesh(geo,new THREE.MeshLambertMaterial({vertexColors:true})));
 // river
 const rp=[];const RV=R.river;for(let k=0;k<RV.length-1;k++){for(let s=0;s<12;s++){const t=s/12,x=RV[k][0]+(RV[k+1][0]-RV[k][0])*t,y=RV[k][1]+(RV[k+1][1]-RV[k][1])*t;const[wx,wz]=toW(x,y);rp.push(new THREE.Vector3(wx,hAt(x,y)+.03,wz));}}
 ribbonMesh(S,rp,()=>.06,0x2f8fb0);
 // labels
 const lab=box.querySelector('.labels');let sets=opt.labels||['okrug'];
 const items=[];sets.forEach(k=>(R.labels[k]||[]).forEach(([n,x,y])=>{const e=el(`<span class="lbl static ${k==='okrug'?'big':''}">${n}</span>`);lab.appendChild(e);const[wx,wz]=toW(x,y);items.push({n,el:e,pos:new THREE.Vector3(wx,Math.max(hAt(x,y),0)+.25,wz)})}));
 S.onFrame(()=>placeLabels(S,box,items));
 const centers={ustirt:[95,330],aral:[330,120],delta:[370,380],qizil:[620,360]};
 if(focus!=null){const[cx,cz]=toW(...centers[opt.focus]);setTimeout(()=>S.flyTo(new THREE.Vector3(cx-1,7.5,cz+7),new THREE.Vector3(cx,0,cz)),300);}
 return {S,items,goLabel(n){const it=items.find(i=>i.n===n);if(!it)return;items.forEach(o=>o.el.classList.toggle('on',o===it));S.flyTo(new THREE.Vector3(it.pos.x-1.5,it.pos.y+4.5,it.pos.z+5),it.pos.clone())},dispose:S.dispose};
}

function riverScene(box){
 const LEN=44,WID=11,NU=300,NZ=70;
 const rz=u=>1.3*Math.sin(u*7.5)+.4*Math.sin(u*23+1);
 const base=u=>u<.45?.45+5.2*Math.pow(1-u/.45,1.25):.45*(1-(u-.45)/.5);
 const relief=u=>u<.5?3.0*Math.pow(1-u/.5,.7)+.2:.12;
 const JU=.443,tz=u=>{const t=(u-.3)/(JU-.3);return rz(JU)+4.2*(1-t)*(1-t)+(1-t)*.3*Math.sin(t*9)};
 const sm=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t)};
 function height(u,z){const dz=z-rz(u),x=u*LEN;
  let h=base(u)+relief(u)*(1-Math.exp(-dz*dz/1.4))*(.5+fbm(x*.35,z*.35)*1.1);
  if(u>.45)h+=.12*fbm(x*.9,z*.9)+.05*Math.sin(x*2.4+z*1.7);
  h-=.3*Math.exp(-dz*dz/.05)*(u<.93?1:0);
  if(u>.3&&u<JU){const dt=z-tz(u);h-=Math.min(relief(u)*(1-Math.exp(-dz*dz/1.4)),relief(u)*Math.exp(-dt*dt/1.2)*.8)+.2*Math.exp(-dt*dt/.04);}
  const s=sm(.9,.965,u);return h*(1-s)+(-.55)*s;}
 const S=makeScene(box,box.querySelector('canvas'),new THREE.Vector3(-26,13,14),new THREE.Vector3(-8,1,0));
 const geo=new THREE.PlaneGeometry(LEN,WID,NU,NZ);geo.rotateX(-Math.PI/2);
 const Pp=geo.attributes.position,col=new Float32Array(Pp.count*3);
 for(let i=0;i<Pp.count;i++){const x=Pp.getX(i),z=Pp.getZ(i);Pp.setY(i,height(x/LEN+.5,z));}
 geo.computeVertexNormals();
 const nrm=geo.attributes.normal,tmp=new THREE.Color(),C=h=>new THREE.Color(h);
 const cSnow=C('#F5F7FA'),cRock=C('#8C7F70'),cFoot=C('#9C9466'),cSand=C('#DCC28A'),cGreen=C('#6E9A48'),cDelta=C('#5E8F4A'),cBed=C('#C9B88F');
 for(let i=0;i<Pp.count;i++){const x=Pp.getX(i),z=Pp.getZ(i),u=x/LEN+.5,h=Pp.getY(i),dz=Math.abs(z-rz(u)),steep=1-nrm.getY(i);
  if(u<.5){if(h>4.2-fbm(x,z)*.8)tmp.copy(cSnow);else if(h>1.6||steep>.35)tmp.copy(cRock);else tmp.copy(cFoot);}

  const n=fbm(x*.6,z*.6)*.1-.05;col[i*3]=tmp.r+n;col[i*3+1]=tmp.g+n;col[i*3+2]=tmp.b+n;}
 geo.setAttribute('color',new THREE.BufferAttribute(col,3));
 S.scene.add(new THREE.Mesh(geo,new THREE.MeshLambertMaterial({vertexColors:true})));
 const main=[];for(let k=0;k<=400;k++){const u=k/400*.93;main.push(new THREE.Vector3((u-.5)*LEN,height(u,rz(u))+.07,rz(u)));}
 ribbonMesh(S,main,t=>.07+.22*t,0x3d9fb5);
 const vax=[];for(let k=0;k<=80;k++){const u=.3+(JU-.3)*k/80,z=tz(u);vax.push(new THREE.Vector3((u-.5)*LEN,height(u,z)+.08,z));}

 const sea=new THREE.Mesh(new THREE.PlaneGeometry(LEN*.08,WID),new THREE.MeshPhongMaterial({color:0x2a8fa6,shininess:90,transparent:true,opacity:.92}));
 sea.rotation.x=-Math.PI/2;sea.position.set(LEN*.46,-.12,0);S.scene.add(sea);
 const glc=new THREE.Mesh(new THREE.SphereGeometry(.9,16,10,0,Math.PI*2,0,Math.PI/2),new THREE.MeshLambertMaterial({color:0xeef6fb}));

 const lab=box.querySelector('.labels');

function aralScene(box){
 const HM=DATA.aral,GW=HM.w,GH=HM.h,raw=dec(HM.d),H=new Float32Array(GW*GH);for(let i=0;i<H.length;i++)H[i]=(raw[i]-128)/30;

 const geo=new THREE.PlaneGeometry(SX,SZ,GW-1,GH-1);geo.rotateX(-Math.PI/2);
 const Pp=geo.attributes.position,N=Pp.count,col=new Float32Array(N*3),isEdge=i=>{const r=Math.floor(i/GW),c=i%GW;return r===0||c===0||r===GH-1||c===GW-1};
 for(let i=0;i<N;i++)Pp.setY(i,isEdge(i)?BASE:H[i]*VS);
 geo.computeVertexNormals();geo.setAttribute('color',new THREE.BufferAttribute(col,3));
 const C=h=>new THREE.Color(h),nrm=geo.attributes.normal,tmp=new THREE.Color();
 const cSalt=C('#F2EEE4'),cSaltDark=C('#DCCFB0'),cUnder=C('#B7A783'),cSand=C('#D7BE87'),cPlat=C('#B4875A'),cCliff=C('#8A6442'),cSkirt=C('#6E5139');
 function paint(level){for(let i=0;i<N;i++){const r=Math.floor(i/GW),c=i%GW,h=H[i]*VS;
  if(isEdge(i))tmp.copy(cSkirt);
  else if(H[i]<-.15){if(h<level)tmp.copy(cUnder);else tmp.copy(cSaltDark).lerp(cSalt,Math.min(1,(h-level)/1.2+.6));}
  else{const steep=1-nrm.getY(i);tmp.copy(cSand).lerp(cPlat,Math.min(1,Math.max(0,(H[i]-.6)/1.6)));if(steep>.25)tmp.lerp(cCliff,Math.min(1,(steep-.25)*2.5));}
  const n=fbm(c*.15,r*.15)*.12-.06;col[i*3]=tmp.r+n;col[i*3+1]=tmp.g+n;col[i*3+2]=tmp.b+n;}
  geo.attributes.color.needsUpdate=true;}
 S.scene.add(new THREE.Mesh(geo,new THREE.MeshLambertMaterial({vertexColors:true})));
 const water=new THREE.Mesh(new THREE.PlaneGeometry(SX-.3,SZ-.3),new THREE.MeshPhongMaterial({color:0x2a8fa6,transparent:true,opacity:.82,shininess:90,specular:0x88ccdd}));
 water.rotation.x=-Math.PI/2;S.scene.add(water);
 const hAt=(fx,fy)=>H[Math.round(fy*(GH-1))*GW+Math.round(fx*(GW-1))]*VS;
 const lab=box.querySelector('.labels');
 const items=[["Moynaq",.27,.72],["Aralsk",.86,.05],["Ústirt",.08,.42],["Ámiwdárya deltası",.48,.9],["Arqa Aral",.62,.13],["Qızılqum",.92,.66]].map(([n,fx,fy])=>{
  const e=el(`<span class="lbl static">${n}</span>`);lab.appendChild(e);return {el:e,pos:new THREE.Vector3((fx-.5)*SX,Math.max(hAt(fx,fy),0)+.35,(fy-.5)*SZ)}});
 S.onFrame(()=>placeLabels(S,box,items));
 let q=null;
 return {set(t){water.position.y=-(t+.5)*VS;const k=Math.round(t*20);if(k!==q){q=k;paint(water.position.y);}},dispose:S.dispose};
}

const app=document.getElementById('app');
P.sc=P.sc||{};P.cls=P.cls||[];
const mKey=(t,mi)=>`t${t.n}.m${mi}`;
const mScore=(t,mi)=>P.sc[mKey(t,mi)];
const topicDone=t=>t.missions.filter((_,i)=>P.done[mKey(t,i)]).length;
const topicPct=t=>{const d=t.missions.map((_,i)=>i).filter(i=>P.done[mKey(t,i)]);if(!d.length)return null;return Math.round(d.reduce((a,i)=>a+(mScore(t,i)||0),0)/d.length*100)};
const totalMissions=()=>TOPICS.reduce((a,t)=>a+t.missions.length,0),totalDone=()=>TOPICS.reduce((a,t)=>a+topicDone(t),0);
const avgPct=()=>{const v=TOPICS.map(topicPct).filter(x=>x!=null);return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):null};
const grade=p=>p==null?'–':p>=86?5:p>=71?4:p>=56?3:2;
let cleanups=[];
function cleanupAll(){cleanups.forEach(f=>{try{f()}catch(e){}});cleanups=[];clearInterval(typeT);clearInterval(mouthT);}
const nextTopic=()=>TOPICS.find(t=>topicDone(t)<t.missions.length);
const pctChip=p=>p==null?'<span class="pchip">Baslanbaǵan</span>':`<span class="pchip ${p>=86?'g5':p>=71?'g4':p>=56?'g3':'g2'}">${p}%</span>`;

/* ---- result code (no server: the student copies a code and sends it to the teacher) ---- */
const b64e=s=>btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const b64d=s=>decodeURIComponent(escape(atob(s.replace(/-/g,'+').replace(/_/g,'/'))));
const chk=s=>{let h=7;for(const ch of s)h=(h*31+ch.charCodeAt(0))%1679616;return h.toString(36)};
function makeCode(){const pr=P.profile||{};const r=TOPICS.map(t=>{const p=topicPct(t);return p==null?'':`${t.n}:${p}:${topicDone(t)}`}).filter(Boolean).join(',');
 const body=['1',pr.name||'',pr.cls||'',r,Math.floor(Date.now()/60000)].join('|');return 'QG8-'+b64e(body+'|'+chk(body));}
function readCode(code){try{const s=b64d(code.slice(4)),parts=s.split('|');const c=parts.pop(),body=parts.join('|');if(chk(body)!==c)return null;
 const [v,name,cls,r,ts]=parts;const res={};(r?r.split(','):[]).forEach(x=>{const [n,p,d]=x.split(':');res[n]={p:+p,d:+d}});return {name,cls,res,ts:+ts};}catch(e){return null}}

function openMission(t,mi){
 const mm=t.missions[mi];const steps=mm.steps.slice();
 if(mm.quiz)steps.push({type:'result',tasks:mm.tasks});
 let si=0,quizScore=0,quizN=steps.filter(s=>s.type==='choice').length,scores=[];
 const run=()=>{
  cleanupAll();app.innerHTML='';const st=steps[si];
  const top=el(`<div class="top gut"><button type="button" class="iconbtn" aria-label="Temaǵa qaytıw">${X_ICON}</button><div class="pbar"><i style="width:${si/steps.length*100}%"></i></div><span class="stepn num">${si+1}/${steps.length}</span></div>`);
  top.querySelector('button').onclick=()=>topic(t);
  const scr=el(`<div class="screen gut"></div>`);
  const host=el(`<div class="host gut"><div class="av" data-av>${DW}</div><div class="bub" data-bub></div></div>`);
  const foot=el(`<div class="foot gut"><p class="fbtxt" hidden></p><div class="frow"><button type="button" class="skip" data-skip>Ótkizip jiberiw ›</button><button type="button" class="btn block" disabled>Dawam etiw</button></div></div>`);
  const btn=foot.querySelector('.btn'),fbt=foot.querySelector('.fbtxt');
  app.append(top,scr,host,foot);
  requestAnimationFrame(()=>top.querySelector('.pbar i').style.width=((si+1)/steps.length*100)+'%');
  let phase='answer';
  const c={key:mKey(t,mi),si,locked:false,quizScore,quizN,check:false,full:false,
   ok(){btn.disabled=false;},ready(v){btn.disabled=!v;},label(x){btn.textContent=x||'Dawam etiw';},cleanup(f){cleanups.push(f)},score(v){scores.push(v)},intercept:null,onCheck:null};
  T[st.type](scr,c,st);
  if(c.full)scr.classList.add('full');
  if(c.check)btn.textContent='Tekseriw';
  const skipB=foot.querySelector('[data-skip]');if(st.type==='result')skipB.hidden=true;
  const advance=()=>{si++;if(si<steps.length)run();else finish(t,mi,scores);};
  skipB.onclick=()=>{if(c.check&&phase==='answer')scores.push(0);advance();};
  btn.onclick=()=>{
   if(c.check&&phase==='answer'){skipB.hidden=true;const r=c.onCheck();c.locked=true;phase='done';if(r.ok)quizScore++;scores.push(r.ok?1:0);
    foot.classList.add(r.ok?'ok':'no');fbt.hidden=false;fbt.innerHTML=`${r.ok?'Durıs.':'Qáte.'}<span>${r.text}</span>`;
    btn.className='btn block '+(r.ok?'ok':'no');btn.textContent='Dawam etiw';say(r.ok?pick(PRAISE):pick(OOPS),r.ok?'happy':'sad');return;}
   if(c.intercept&&c.intercept())return;
   advance();};
  requestAnimationFrame(()=>requestAnimationFrame(()=>scr.querySelectorAll('.tr i').forEach(i=>i.style.width=i.style.getPropertyValue('--w'))));
  const hostTxt=st.host||(c.check?pick(['Durıs juwaptı tańla.','Oylap kórip tańla.','Sorawdı dıqqat penen oqı.']):st.type==='result'?'':pick(['Dıqqat penen oqı.','Bul maǵlıwmat testte kerek boladı.','Áhmiyetli sanlardı dápterge jazıp al.']));
  if(hostTxt)setTimeout(()=>{const b=document.querySelector('[data-bub]');if(b&&!b.textContent)say(hostTxt)},120);
 };
 run();
}

 const sc=scores.length?scores.reduce((a,b)=>a+b,0)/scores.length:1;
 P.sc[k]=Math.max(P.sc[k]||0,sc);P.done[k]=true;save();

}

function tPlan(scr){
 scr.append(el(`<p class="sub">Har mavzu uchun 45 daqiqalik dars rejasi. Reja ilovadagi bo‘limlar asosida tuzilgan; sinfingizga moslab o‘zgartiring.</p>`));
 TOPICS.forEach(t=>{const learn=t.missions.filter(m=>!m.quiz),quiz=t.missions.find(m=>m.quiz),tasks=(quiz&&quiz.tasks)||[];
  const d=el(`<details class="card plan"><summary><b>${t.n}-mavzu.</b> ${t.title} <span class="cap">· ${t.pages}-bet</span></summary>
   <div class="pl"><p><b>Maqsad:</b> o‘quvchilar «${t.title}» mavzusidagi asosiy tushunchalar, raqamlar va xarita obyektlarini biladi, ularni misollar bilan tushuntira oladi.</p>
   <ol class="steps">
    <li><span class="tm">5 daq</span><div><b>Kirish.</b> Oldingi mavzuni takrorlash, uy vazifasini tekshirish. Mavzu savolini qo‘yish: «${t.intro.replace(/<[^>]+>/g,'')}»</div></li>
    <li><span class="tm">15 daq</span><div><b>Yangi mavzu.</b> Darslikning ${t.pages}-betlari va ilovadagi bo‘limlar: ${learn.slice(0,Math.ceil(learn.length/2)).map(m=>'«'+m.title+'»').join(', ')||'—'}. Proyektor orqali birga ko‘rish tavsiya etiladi${learn.some(m=>m.steps.some(s=>/3d/.test(s.type)))?' (3D modelni sinfda birga aylantirib ko‘ring)':''}.</div></li>
    <li><span class="tm">15 daq</span><div><b>Mustahkamlash.</b> O‘quvchilar juftlikda yoki mustaqil bajaradi: ${learn.slice(Math.ceil(learn.length/2)).map(m=>'«'+m.title+'»').join(', ')||'darslikdagi topshiriqlar'}.</div></li>
    <li><span class="tm">7 daq</span><div><b>Nazorat.</b> ${quiz?`«${quiz.title}» (${quiz.steps.length} savol). Natija avtomatik hisoblanadi.`:'Og‘zaki so‘rov va ilovadagi mashqlar natijasi.'}</div></li>
    <li><span class="tm">3 daq</span><div><b>Uy vazifasi.</b> ${tasks.length?tasks.join(' '):'Darslikdagi «Soraw hám tapsırmalar».'} O‘quvchi natija kodini o‘qituvchiga yuboradi.</div></li>
   </ol></div></details>`);scr.append(d);});
}

  <p class="sub">Ilova har bir bo‘lim uchun to‘g‘ri bajarilgan topshiriqlar ulushini hisoblaydi. Mavzu natijasi – bajarilgan bo‘limlar o‘rtachasi; jadvalda mavzu to‘liq tugallanmagan bo‘lsa, raqam kursivda ko‘rsatiladi. Test savollari, xarita, saralash, juftlash va hisoblash topshiriqlari hisobga olinadi; o‘tkazib yuborilgan savol 0 ball.</p>
  <div class="tbl"><table><thead><tr><th>Natija</th><th>Baho</th><th>Izoh</th></tr></thead><tbody>
   <tr><td class="num">86–100 %</td><td><span class="pchip g5">5</span></td><td>Mavzuni to‘liq o‘zlashtirgan, raqam va obyektlarni aniq biladi</td></tr>
   <tr><td class="num">71–85 %</td><td><span class="pchip g4">4</span></td><td>Asosiy tushunchalarni biladi, ayrim xatolar bor</td></tr>
   <tr><td class="num">56–70 %</td><td><span class="pchip g3">3</span></td><td>Qisman o‘zlashtirgan, takrorlash kerak</td></tr>
   <tr><td class="num">0–55 %</td><td><span class="pchip g2">2</span></td><td>Mavzuni qayta o‘rganish kerak</td></tr></tbody></table></div>
  <p class="cap">Bu tavsiya etiladigan shkala. Yakuniy bahoni o‘qituvchi og‘zaki javob, daftar va loyiha ishlarini ham hisobga olib qo‘yadi.</p></div>`));
 scr.append(el(`<div class="card"><h2 class="h" style="font-size:1.05rem">Ilova bilan ishlash tartibi</h2><ul class="ul">
  <li>Dars boshida o‘quvchilar ism va sinfini bir marta kiritadi.</li><li>Natijalar o‘quvchi qurilmasida saqlanadi; bo‘limni qayta bajarsa, eng yaxshi natija olinadi.</li>
  <li>Hafta oxirida o‘quvchilar kodini yuboradi – siz «Natijalar» bo‘limiga qo‘yasiz. Bir o‘quvchining yangi kodi eskisini almashtiradi.</li>
  <li>Kod oddiy tekshiruv belgisiga ega: qo‘lda o‘zgartirilgan kod qabul qilinmaydi.</li></ul></div>`));
}

 const r=el(`<div class="card"><h2 class="h" style="font-size:1.05rem">Shu qurilmadagi ma’lumotlar</h2><p class="sub">Bu qurilmadagi o‘quvchi natijalarini o‘chirish (sinf jadvaliga ta’sir qilmaydi).</p><div class="row" style="justify-content:flex-start"><button type="button" class="btn ghost sm" data-reset>Natijalarni o‘chirish</button></div></div>`);

 scr.append(c,r);
